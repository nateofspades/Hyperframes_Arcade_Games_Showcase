name: Publish showcase webpage
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble website and verified release video
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p "${RUNNER_TEMP}/arcade-pages"
          cp -R site/. "${RUNNER_TEMP}/arcade-pages/"
          gh release download showcase-video-2026-10-29-compatible --pattern Arcade_Games_Showcase-compatible-2026-10-29.mp4 --output "${RUNNER_TEMP}/arcade-pages/media/showcase.mp4"
          python3 -c 'import hashlib,os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"arcade-pages/media/showcase.mp4"; assert hashlib.sha256(p.read_bytes()).hexdigest()=="4c95e6940e09f1676de8614a742bf79ded153c889fdece94238d4d684c2950ca", "Release video checksum mismatch"'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/arcade-pages
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
